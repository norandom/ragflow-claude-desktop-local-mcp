name: "Bandit Security Scan"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2'  # Weekly on Tuesdays at 6 AM UTC

jobs:
  bandit:
    name: Security Analysis with Bandit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: python -m pip install 'bandit[sarif]==1.9.4'

    - name: Run Bandit security scan
      run: bandit -r src/ -f sarif -o bandit-report.sarif

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
      # GitHub Security tab only — no Gitea equivalent. Gitea skips (this step
      # has no continue-on-error, so without the guard it hard-fails on Gitea).
      if: ${{ always() && github.server_url == 'https://github.com' && hashFiles('bandit-report.sarif') != '' }}
      with:
        sarif_file: bandit-report.sarif

    - name: Upload Bandit report as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.*
        retention-days: 30